<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#c7d9fa">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Roadio">
  <link rel="manifest" href="./manifest.webmanifest">
  <title>Roadio</title>
  <link rel="stylesheet" href="./styles.css?v=20261109-06a-list-height">
  <script src="./config.js" defer></script>
  <script src="./main.js?v=20261109-dev10" defer></script>
</head>
<body>
  <main class="app" id="app">
    <nav class="quick-menu" aria-label="주요 메뉴">
      <button type="button" id="my-capsules" aria-label="내 캡슐로 이동" title="내 캡슐">
        <img src="./assets/archive.svg" alt="">
      </button>
      <button type="button" id="capsule-map" aria-label="이야기 위치 지도로 이동" title="이야기 지도">
        <img src="./assets/map.svg" alt="">
      </button>
    </nav>

    <section class="home" id="home-screen" aria-labelledby="home-title">
      <h1 id="home-title">어떤 이야기를<br>들려주고 싶으신가요?</h1>
      <div class="art" aria-hidden="true">
        <img class="orbit orbit-outer" src="./assets/orbit-outer.svg" alt="">
        <div class="center-glow"></div>
        <img class="orbit orbit-middle" src="./assets/orbit-middle.svg" alt="">
        <img class="orbit orbit-inner" src="./assets/orbit-inner.svg" alt="">
        <img class="brand-symbol" src="./assets/roadio-symbol.svg" alt="">
      </div>
      <p class="record-timer" id="record-timer" role="timer" aria-label="녹음 시간" hidden><img src="./assets/recording-dot.svg" alt=""><span>00:00</span></p>
      <p class="message" id="message" role="status" aria-live="polite"></p>
      <div class="home-actions" id="home-actions">
        <button class="primary-button" id="record-button" type="button">
          <img src="./assets/microphone.svg" alt="">
          <span>이야기 녹음</span>
        </button>
      </div>
      <div class="recording-actions" id="recording-actions" hidden>
        <button class="secondary-button" id="cancel-button" type="button">취소</button>
        <button class="primary-button" id="stop-button" type="button"><img src="./assets/stop.svg" alt=""><span>녹음 완료</span></button>
      </div>
    </section>

    <section class="preview" id="preview-screen" aria-labelledby="preview-title" hidden>
      <h1 id="preview-title">녹음된 이야기를<br>확인해보세요</h1>
      <div class="art preview-art" aria-hidden="true">
        <img class="orbit orbit-outer" src="./assets/orbit-outer.svg" alt="">
        <div class="center-glow"></div>
        <img class="orbit orbit-middle" src="./assets/orbit-middle.svg" alt="">
        <img class="orbit orbit-inner" src="./assets/orbit-inner.svg" alt="">
        <img class="brand-symbol" src="./assets/roadio-symbol.svg" alt="">
      </div>
      <label class="visually-hidden" for="story-title">이야기 제목</label>
      <input class="story-title" id="story-title" type="text" maxlength="40" placeholder="이야기에 이름을 붙여주세요" autocomplete="off" aria-label="이야기 제목">
      <div class="preview-seek" id="preview-seek" role="slider" tabindex="0" aria-label="녹음 재생 위치" aria-valuemin="0" aria-valuemax="0" aria-valuenow="0" aria-valuetext="00:00">
        <img class="seek-track" src="./assets/preview-arc-track.svg" alt="">
        <svg class="seek-progress" viewBox="0 0 199.246 109.623" aria-hidden="true" focusable="false">
          <path id="seek-progress-path" d="M 12.2405 6 A 87.3824 87.3824 0 0 0 187.0055 6" pathLength="100"></path>
        </svg>
        <img class="seek-handle" id="seek-handle" src="./assets/preview-seek-handle.svg" alt="">
      </div>
      <div class="preview-playback">
        <button class="play-toggle" id="play-toggle" type="button" aria-label="재생"><img id="play-icon" src="./assets/play.svg" alt=""></button>
        <time id="playback-time">00:00</time>
      </div>
      <audio id="audio-preview" preload="metadata"></audio>
      <div class="preview-actions">
        <button class="secondary-button" id="rerecord-button" type="button"><img src="./assets/restart.svg" alt=""><span>다시</span></button>
        <button class="primary-button" id="next-button" type="button">위치 선택하기</button>
      </div>
    </section>

    <section class="location" id="location-screen" aria-label="이야기를 남길 위치 선택" hidden>
      <div class="location-map" id="location-map" aria-label="네이버 지도"></div>
      <div class="location-map-fallback" id="location-map-fallback" role="status" hidden>
        <strong>네이버 지도 연결이 필요해요</strong>
        <span id="location-map-fallback-text">지도 인증값을 설정해 주세요.</span>
      </div>
      <div class="location-radius-preview" id="location-radius-preview" aria-hidden="true"></div>
      <img class="location-center-pin" src="./assets/location-pin.svg" alt="" aria-hidden="true">
      <button class="location-back" id="location-back" type="button" aria-label="미리듣기로 돌아가기"><img src="./assets/location-back.svg" alt=""></button>
      <div class="location-search" id="location-search">
        <label class="visually-hidden" for="location-query">위치 검색</label>
        <input id="location-query" type="search" placeholder="위치를 검색하세요." autocomplete="off" enterkeyhint="search" aria-controls="location-results" aria-expanded="false">
        <p class="location-search-status" id="location-search-status" role="status" aria-live="polite" hidden></p>
        <ul class="location-results" id="location-results" role="listbox" aria-label="위치 검색 결과" hidden></ul>
      </div>
      <button class="location-current" id="location-current" type="button" aria-label="현재 위치로 이동"><img src="./assets/location-current.svg" alt=""></button>
      <p class="location-toast" id="location-toast" role="status" aria-live="polite" hidden></p>
      <button class="primary-button location-confirm" id="location-confirm" type="button" disabled>해당 위치로 선택</button>
    </section>

    <section class="audience" id="audience-screen" aria-labelledby="audience-title" hidden>
      <button class="audience-back" id="audience-back" type="button" aria-label="위치 선택으로 돌아가기"><img src="./assets/audience-back.svg" alt=""></button>
      <div class="audience-content">
        <div class="audience-choice">
          <h1 id="audience-title">누구에게<br>들려주고 싶은가요?</h1>
          <div class="audience-options" role="radiogroup" aria-label="공개 범위">
            <button class="audience-option is-selected" type="button" role="radio" aria-checked="true" data-audience="private">
              <span class="audience-icon"><img src="./assets/audience-lock.svg" alt=""></span>
              <span class="audience-copy"><strong>나만</strong><small>나만 들을 수 있어요.</small></span>
              <img class="audience-check" src="./assets/audience-check.svg" alt="">
            </button>
            <button class="audience-option" type="button" role="radio" aria-checked="false" data-audience="neighbors" tabindex="-1">
              <span class="audience-icon"><img src="./assets/audience-neighbors.svg" alt=""></span>
              <span class="audience-copy"><strong>내 이웃</strong><small>초대한 이웃만 들을 수 있어요.</small></span>
              <img class="audience-check" src="./assets/audience-check.svg" alt="">
            </button>
            <button class="audience-option" type="button" role="radio" aria-checked="false" data-audience="public" tabindex="-1">
              <span class="audience-icon"><img src="./assets/audience-globe.svg" alt=""></span>
              <span class="audience-copy"><strong>전체 공개</strong><small>누구나 들을 수 있어요.</small></span>
              <img class="audience-check" src="./assets/audience-check.svg" alt="">
            </button>
          </div>
        </div>
        <p class="audience-period">등록 후 <strong>3일 동안</strong> 들을 수 있어요.</p>
      </div>
      <button class="primary-button audience-submit" id="audience-submit" type="button">나에게만 들려주기</button>
    </section>

    <section class="review" id="review-screen" aria-labelledby="review-title" hidden>
      <button class="review-back" id="review-back" type="button" aria-label="공개 범위 선택으로 돌아가기"><img src="./assets/review-back.svg" alt=""></button>
      <h1 id="review-title">이야기를<br>한 번 더 확인하세요</h1>
      <div class="review-identity">
        <span class="review-audience-icon"><img id="review-audience-icon" src="./assets/review-lock.svg" alt=""></span>
        <strong class="review-story-title" id="review-story-title"></strong>
        <p class="review-address" id="review-address" role="status" aria-live="polite"></p>
      </div>
      <div class="review-art" aria-hidden="true"><img src="./assets/review-symbol.svg" alt=""></div>
      <div class="review-seek" id="review-seek" role="slider" tabindex="0" aria-label="등록 전 확인 재생 위치" aria-valuemin="0" aria-valuemax="0" aria-valuenow="0" aria-valuetext="00:00">
        <img class="seek-track" src="./assets/review-arc-track.svg" alt="">
        <svg class="seek-progress" viewBox="0 0 199.246 109.623" aria-hidden="true" focusable="false"><path id="review-seek-progress-path" d="M 12.2405 6 A 87.3824 87.3824 0 0 0 187.0055 6" pathLength="100"></path></svg>
        <img class="seek-handle" id="review-seek-handle" src="./assets/review-arc-handle.svg" alt="">
      </div>
      <div class="review-playback"><button class="play-toggle" id="review-play-toggle" type="button" aria-label="재생"><img id="review-play-icon" src="./assets/review-play.svg" alt=""></button><time id="review-playback-time">00:00</time></div>
      <p class="review-error" id="review-error" role="alert"></p>
      <button class="primary-button review-submit" id="review-submit" type="button">이야기 놓아두기</button>
    </section>

    <section class="archive-screen" id="archive-screen" aria-label="내 캡슐" hidden>
      <button class="archive-back" id="archive-back" type="button" aria-label="홈으로 돌아가기"><img src="./assets/archive-back.svg" alt=""></button>
      <div class="archive-card">
        <ul class="archive-list" id="archive-list" aria-label="내가 만든 이야기"></ul>
        <p class="archive-empty" id="archive-empty" hidden>아직 놓아둔 이야기가 없어요.</p>
      </div>
      <p class="archive-status" id="archive-status" role="status" aria-live="polite" hidden></p>
    </section>

    <div class="archive-overlay" id="archive-overlay" hidden>
      <div class="archive-dialog audience-dialog" id="archive-audience-dialog" role="dialog" aria-modal="true" aria-labelledby="archive-audience-title" hidden>
        <h2 id="archive-audience-title"></h2>
        <div class="archive-audience-options" id="archive-audience-options" role="radiogroup" aria-label="변경할 공개 범위"></div>
        <div class="archive-dialog-actions"><button class="archive-cancel" type="button">취소</button><button class="archive-confirm" id="archive-audience-confirm" type="button">변경</button></div>
      </div>
      <div class="archive-dialog delete-dialog" id="archive-delete-dialog" role="dialog" aria-modal="true" aria-labelledby="archive-delete-title" hidden>
        <img class="archive-trash" src="./assets/archive-trash.svg" alt="">
        <h2 id="archive-delete-title"></h2>
        <p>삭제하면 복원이 불가능해요.</p>
        <div class="archive-dialog-actions"><button class="archive-cancel" type="button">취소</button><button class="archive-confirm archive-delete-confirm" id="archive-delete-confirm" type="button">삭제</button></div>
      </div>
    </div>

    <section class="pending" id="pending-screen" aria-labelledby="pending-title" hidden>
      <h1 id="pending-title"></h1>
      <p id="pending-description"></p>
      <button class="secondary-button" id="back-button" type="button">홈으로 돌아가기</button>
    </section>
  </main>
</body>
</html>
