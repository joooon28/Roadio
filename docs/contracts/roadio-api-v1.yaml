openapi: 3.1.0
info:
  title: Roadio capsule contract
  version: 0.3.0
  description: DEV-10 local web client integration. Public deployment and production identity are pending.
servers:
  - url: http://127.0.0.1:8787
    description: Local development only. Use HTTPS and a production identity provider before deployment.
security:
  - bearerAuth: []
paths:
  /v1/capsules:
    post:
      summary: Create a capsule from a mobile recording
      operationId: createCapsule
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          description: Stable random key reused when the same upload is retried.
          schema: { type: string, minLength: 16, maxLength: 100 }
      requestBody:
        required: true
        content:
          multipart/form-data:
            encoding:
              metadata:
                contentType: application/json
            schema:
              type: object
              required: [metadata, audio]
              properties:
                metadata:
                  $ref: '#/components/schemas/CreateCapsule'
                audio:
                  type: string
                  format: binary
                  description: Up to 10 MiB. Supported MIME types are audio/webm, audio/mp4, audio/mpeg, audio/wav, audio/x-wav, audio/ogg and audio/aac.
      responses:
        '201':
          description: Capsule created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OwnerCapsule'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '413': { description: Audio exceeds the 10 MiB server limit. }
    get:
      summary: List my capsules for the mobile app
      operationId: listOwnCapsules
      responses:
        '200':
          description: Includes active, expired and deleted items for owner management.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/OwnerCapsule' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /v1/capsules/nearby/search:
    post:
      summary: Find capsules accessible at one vehicle location
      description: Server checks audience, publication state, expiry, deletion, moderation and radius. No search history is stored for MVP.
      operationId: searchNearbyCapsules
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NearbySearch' }
      responses:
        '200':
          description: Accessible capsule summaries only; no exact capsule coordinates or audio URLs.
          headers:
            Cache-Control:
              schema: { type: string, const: no-store }
          content:
            application/json:
              schema:
                type: object
                required: [capsules]
                properties:
                  capsules:
                    type: array
                    items: { $ref: '#/components/schemas/CapsuleSummary' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /v1/capsules/{capsuleId}/audio:
    parameters:
      - $ref: '#/components/parameters/CapsuleId'
    get:
      summary: Stream audio after a user selects a capsule
      description: Server rechecks access, expiry and deletion on every request. Supports HTTP Range for media playback. Never auto-play on proximity events.
      operationId: streamCapsuleAudio
      parameters:
        - name: Range
          in: header
          required: false
          schema: { type: string }
      responses:
        '200': { description: Full audio body with actual audio Content-Type. }
        '206': { description: Partial audio body with Content-Range. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /v1/capsules/{capsuleId}:
    parameters:
      - $ref: '#/components/parameters/CapsuleId'
    patch:
      summary: Change an active capsule's visibility
      operationId: changeOwnCapsuleVisibility
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [visibility]
              additionalProperties: false
              properties:
                visibility: { $ref: '#/components/schemas/Visibility' }
                selectedRecipientUserIds:
                  type: array
                  uniqueItems: true
                  items: { type: string, format: uuid }
      responses:
        '200':
          description: Updated owner capsule
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OwnerCapsule' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      summary: Delete my capsule
      operationId: deleteOwnCapsule
      responses:
        '204': { description: Deleted; subsequent search and audio requests exclude it. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /v1/me/recipients:
    get:
      summary: List the owner's configured test recipients
      description: DEV-10 local roster, populated by CLI. It is not a production invitation or consent flow.
      operationId: listMyRecipients
      responses:
        '200':
          description: Test recipients
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required: [id, displayName]
                  properties:
                    id: { type: string, format: uuid }
                    displayName: { type: string }
        '401': { $ref: '#/components/responses/Unauthorized' }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: DEV-09 local prototype uses manually provisioned random bearer tokens, stored as SHA-256 hashes. Production identity provider is still undecided. Both apps must resolve to the same server user ID.
  parameters:
    CapsuleId:
      name: capsuleId
      in: path
      required: true
      schema: { type: string, format: uuid }
  responses:
    BadRequest:
      description: Invalid metadata, coordinate, radius, recipient or expiry.
    Unauthorized:
      description: Missing or invalid authenticated identity.
    NotFound:
      description: Capsule is absent or not accessible. Do not reveal existence to other users.
  schemas:
    Visibility:
      type: string
      enum: [SELF, SELECTED, PUBLIC]
    ContentOrigin:
      type: string
      enum: [MOBILE_RECORDING, PRELOADED_SAMPLE]
      description: PRELOADED_SAMPLE is allowed only in an explicitly labeled demo environment.
    LocationSource:
      type: string
      enum: [PLEOS_DEVICE, PLEOS_EMULATOR, DEMO_MANUAL]
      description: Client display/diagnostic metadata, not a server authorization signal. DEMO_MANUAL is a typed simulation coordinate and must be visibly labelled.
    GeoPoint:
      type: object
      required: [latitude, longitude]
      additionalProperties: false
      properties:
        latitude: { type: number, minimum: -90, maximum: 90 }
        longitude: { type: number, minimum: -180, maximum: 180 }
    CreateCapsule:
      type: object
      description: Client omits discovery radius and expiry; server assigns 100 meters and expiresAt = createdAt + 72 hours.
      required: [title, position, visibility, contentOrigin, durationMs]
      additionalProperties: false
      if:
        properties:
          visibility: { const: SELECTED }
      then:
        required: [selectedRecipientUserIds]
        properties:
          selectedRecipientUserIds: { minItems: 1 }
      else:
        properties:
          selectedRecipientUserIds: { maxItems: 0 }
      properties:
        title: { type: string, minLength: 1, maxLength: 80 }
        description: { type: string, maxLength: 160 }
        position: { $ref: '#/components/schemas/GeoPoint' }
        visibility: { $ref: '#/components/schemas/Visibility' }
        selectedRecipientUserIds:
          type: array
          uniqueItems: true
          items: { type: string, format: uuid }
          description: Required and nonempty only for SELECTED; empty/omitted for SELF or PUBLIC. Server validates each recipient.
        contentOrigin: { $ref: '#/components/schemas/ContentOrigin' }
        durationMs: { type: integer, minimum: 1, maximum: 600000, description: Client-measured duration; server validates bounds. }
    CapsuleSummary:
      type: object
      required: [id, title, authorDisplayName, durationMs, visibility, expiresAt, distanceMeters, contentOrigin]
      additionalProperties: false
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        authorDisplayName: { type: string }
        durationMs: { type: integer, minimum: 1 }
        visibility: { $ref: '#/components/schemas/Visibility' }
        expiresAt: { type: string, format: date-time }
        distanceMeters: { type: integer, minimum: 0 }
        contentOrigin: { $ref: '#/components/schemas/ContentOrigin' }
    OwnerCapsule:
      type: object
      required: [id, title, ownerUserId, position, radiusMeters, visibility, expiresAt, createdAt, durationMs, contentOrigin, state]
      additionalProperties: false
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        description: { type: string }
        ownerUserId: { type: string, format: uuid }
        position: { $ref: '#/components/schemas/GeoPoint' }
        radiusMeters: { type: integer, const: 100, description: 'Server-assigned fixed discovery radius in meters.' }
        visibility: { $ref: '#/components/schemas/Visibility' }
        selectedRecipientUserIds:
          type: array
          items: { type: string, format: uuid }
        expiresAt: { type: string, format: date-time, description: 'Server-assigned createdAt plus 72 hours.' }
        createdAt: { type: string, format: date-time }
        durationMs: { type: integer, minimum: 1 }
        contentOrigin: { $ref: '#/components/schemas/ContentOrigin' }
        state: { type: string, enum: [ACTIVE, EXPIRED, DELETED, PENDING_REVIEW] }
    NearbySearch:
      type: object
      required: [position, locationSource]
      additionalProperties: false
      properties:
        position: { $ref: '#/components/schemas/GeoPoint' }
        locationSource: { $ref: '#/components/schemas/LocationSource' }
        limit: { type: integer, minimum: 1, maximum: 30, default: 20 }
